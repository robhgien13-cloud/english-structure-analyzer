name: Test SuPar lightweight constituency parser

on:
  workflow_dispatch:

jobs:
  supar-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          pip install 'supar==1.1.4' 'transformers<5'
      - name: Run non-BERT model and measure RSS
        run: python scripts/test_supar_lightweight.py
      - name: Upload result including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supar-lightweight-results
          path: supar-test-results/
          if-no-files-found: warn
