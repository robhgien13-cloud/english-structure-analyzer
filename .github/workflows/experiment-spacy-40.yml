name: Experiment spaCy correction on 40 cases
on:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install 'spacy>=3.8,<4'
          python -m spacy download en_core_web_sm
      - run: python scripts/experiment_spacy_40.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spacy-correction-40
          path: parser-40-results/spacy-app-normalized.json
