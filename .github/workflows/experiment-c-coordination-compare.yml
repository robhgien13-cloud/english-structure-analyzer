name: Experiment C coordination comparison
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/syntax-validation-c
    paths:
      - '.github/workflows/experiment-c-coordination-compare.yml'
      - 'scripts/compare_experiment_c_coordination.py'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spaCy model
        run: |
          pip install 'spacy>=3.8,<4'
          python -m spacy download en_core_web_sm
      - name: Run syntax regression
        run: python -m unittest discover -s tests -p test_syntax_validation.py
      - name: Compare coordination against unapproved candidate
        run: python scripts/compare_experiment_c_coordination.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-c-coordination-comparison
          path: parser-40-results/experiment-c-coordination-comparison.json
          if-no-files-found: warn
