name: Compare parser raw outputs on 40 sentences
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [spacy, supar, benepar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate draft corpus
        run: python scripts/validate_parser_gold.py
      - name: Install parser
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.engine }}" = "spacy" ]; then
            pip install 'spacy>=3.7,<4'
            python -m spacy download en_core_web_sm
          elif [ "${{ matrix.engine }}" = "supar" ]; then
            pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
            pip install 'supar==1.1.4' 'transformers<5'
          else
            pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
            pip install 'spacy>=3.7,<4' 'benepar>=0.2.0,<0.3'
            python -c "import benepar; benepar.download('benepar_en3')"
          fi
      - name: Collect raw parses
        run: python scripts/collect_parser_40.py --engine ${{ matrix.engine }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-40-${{ matrix.engine }}
          path: parser-40-results/
          if-no-files-found: warn
