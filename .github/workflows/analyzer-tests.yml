name: Analyzer regression tests
on:
  push:
    paths:
      - 'analyzer.py'
      - 'tests/**'
      - '.github/workflows/analyzer-tests.yml'
  pull_request:
    paths:
      - 'analyzer.py'
      - 'tests/**'
      - '.github/workflows/analyzer-tests.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run model-independent regression tests
        run: python -m unittest discover -s tests -p 'test_analyzer.py' -v
      - name: Install spaCy and English model
        run: |
          python -m pip install 'spacy>=3.8,<4'
          python -m spacy download en_core_web_sm
      - name: Run real-model integration tests
        run: python -m unittest discover -s tests -p 'test_real_spacy.py' -v
