name: Analyzer regression tests
on:
  push:
    paths:
      - 'analyzer.py'
      - 'tests/**'
      - '.github/workflows/analyzer-tests.yml'
  pull_request:
    paths:
      - 'analyzer.py'
      - 'tests/**'
      - '.github/workflows/analyzer-tests.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run model-independent regression tests
        run: python -m unittest discover -s tests -v
