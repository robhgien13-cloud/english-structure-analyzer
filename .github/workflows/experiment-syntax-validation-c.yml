name: Experiment C syntax validation
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/syntax-validation-c
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install 'spacy>=3.8,<4'
          python -m spacy download en_core_web_sm
      - run: python -m unittest discover -s tests -p test_syntax_validation.py
      - run: python scripts/evaluate_grammar_candidates_20.py
      - run: python scripts/evaluate_complex_candidates_10.py
      - run: python scripts/evaluate_holdout_complex_10.py
