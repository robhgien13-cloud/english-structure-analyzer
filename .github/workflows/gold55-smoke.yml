name: Gold 55 analyzer smoke (test branch)
on:
  push:
    branches:
      - test/gold-55-regression
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install analyzer dependencies
        run: python -m pip install -r requirements.txt
      - name: Install trained English model
        run: python -m spacy download en_core_web_sm
      - name: Check trained model
        run: python -c "import spacy; spacy.load('en_core_web_sm'); print('trained model ready')"
      - name: Run approved 55 sentence smoke test
        run: python tests/smoke_gold55.py
      - name: Run adapter on all 55 real parser outputs
        run: python tests/check_gold55_adapter.py
