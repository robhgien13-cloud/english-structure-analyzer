name: Compare spaCy and Stanza
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parsers
        run: |
          python -m pip install --upgrade pip
          python -m pip install spacy stanza
          python -m spacy download en_core_web_sm
          python -c "import stanza; stanza.download('en', processors='tokenize,pos,lemma,depparse', verbose=False)"
      - name: Compare dependency parses
        run: python scripts/compare_parsers.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-comparison
          path: parser-benchmark-results/
