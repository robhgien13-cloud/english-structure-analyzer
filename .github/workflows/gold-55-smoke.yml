name: Gold regression environment and special syntax smoke test
on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/spacy-correction-40]
  push:
    branches: [test/gold-55-regression]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spacy
          python -m spacy download en_core_web_sm
      - name: Run parser on all G001-G055 and store actual outputs
        run: PYTHONPATH=. python tests/run_gold_55_capture.py
      - name: Diagnose coordination and inversion without masking known failures
        run: PYTHONPATH=. python tests/diagnose_four_structures.py
      - name: Upload actual outputs for human-reviewed scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g001-g055-parser-output
          path: |
            artifacts/g001-g055-actual.json
            artifacts/focused-four-diagnostic.json
          if-no-files-found: warn
