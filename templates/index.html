<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文読解診断 | 文を選ぶ</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><main class="container"><h1>英文読解診断</h1><p class="subtitle">まず診断する英文を選びましょう。</p>
<section class="input-area"><h2>入力方法</h2><label for="imageInput">写真・画像から英文を読み取る</label><input id="imageInput" type="file" accept="image/*" aria-describedby="ocrHint"><p id="ocrHint" class="subtitle">スマホの写真や画像ファイルを選択できます。画像はブラウザ内で文字認識し、アプリのサーバーには送信しません。初回はOCR用データをダウンロードします。</p><button id="ocrButton" type="button">画像から英文を読み取る</button><div id="ocrStatus" role="status" aria-live="polite"></div><p class="subtitle">読み取った英文を下で確認・修正してから解析してください。</p><label for="sentence">英文を入力・確認・修正</label><textarea id="sentence" rows="7" placeholder="英文を複数文入力してください"></textarea>
<fieldset><legend>文の選択方法</legend><label class="choice"><input type="radio" name="selectionMode" value="auto" checked> 自動選択：長い順に最大5文</label><label class="choice"><input type="radio" name="selectionMode" value="manual"> 手動選択：すべての文から選ぶ</label></fieldset>
<button id="analyzeButton">英文を解析して候補を表示</button></section>
<section class="result-area"><h2>診断する文を選択</h2><div id="status" role="status">英文を入力してください。</div><div id="result"></div><section id="chosen" hidden><h3>選択した英文</h3><p id="chosenText"></p><button id="startDiagnosis" type="button">この文で診断を開始</button></section><section id="diagnosis" class="result-area" hidden><h2>単語と文構造の診断（試験版）</h2><p class="subtitle">最初に分からない単語をタップして登録します。その後、構造診断へ進んでください。</p><div id="diagnosisStatus" role="status"></div><div id="diagnosisWords" class="word-row"></div><div id="unknownWords"></div><button id="beginRoles" type="button">S/V/O/Cの診断へ進む</button><section id="rolesPanel" hidden><h3 id="rolePrompt"></h3><p class="subtitle">連続した範囲は最初と最後の単語をタップ。離れた要素は範囲を追加できます。「なし」も選べます。</p><div id="roleWords" class="word-row"></div><p id="selectedRanges"></p><button id="addRange" type="button">選択範囲を追加</button><button id="noRole" type="button">この要素はなし</button><button id="submitRole" type="button">回答を確定して次へ</button></section><section id="diagnosisSummary" hidden></section></section><section hidden></section></section></main><script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="{{ url_for('static',filename='script.js') }}"></script></body></html>
