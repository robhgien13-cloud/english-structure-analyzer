<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Structure Analyzer</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <main class="container">

    <h1>English Structure Analyzer</h1>
    <p class="subtitle">
      英文を入力すると、文構造を解析します。
    </p>

    <section class="input-area">

      <label for="sentence">英文</label>

      <textarea
        id="sentence"
        placeholder="英文を入力してください"
        rows="6"></textarea>

      <button id="analyzeButton">
        構造を解析
      </button>

    </section>

    <section id="resultArea" class="result-area">

      <h2>解析結果</h2>

      <div id="status">
        英文を入力して「構造を解析」を押してください。
      </div>

      <div id="result"></div>

    </section>

  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
